<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f5f7fa" />
    <title>Last Stick Standing</title>
    <!-- Game fonts: Bangers for display/headings, Nunito for body text. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #f5f7fa;
        overflow: hidden;
        /* Prevent the mobile browser from hijacking touch gestures. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #game {
        width: 100%;
        height: 100%;
        /* Respect notches / safe areas on phones. */
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        box-sizing: border-box;
      }
      canvas {
        display: block;
        margin: 0 auto;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
